name: gh-gateway-e2e

services:
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test

  gitea:
    build:
      context: .
      dockerfile: docker/gitea/Dockerfile
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: https://git.example.test/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__repository__DEFAULT_BRANCH: main
    volumes:
      - gitea-data:/data
      - e2e-state:/state
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz >/dev/null && test -s /state/gateway.token && test -s /state/forker.token"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s

  gateway:
    build:
      context: .
      target: runtime
    environment:
      GITEA_BASE_URL: http://gitea:3000
      GATEWAY_ADDR: :8080
    command: ["serve"]
    depends_on:
      gitea:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 8080"]
      interval: 2s
      timeout: 2s
      retries: 30

  actions-fixture:
    build:
      context: .
      dockerfile: docker/actions-fixture/Dockerfile
    environment:
      UPSTREAM_URL: http://gitea:3000
      FIXTURE_LOG: /state/actions-fixture.log
    volumes:
      - e2e-state:/state
    depends_on:
      gitea:
        condition: service_healthy

  rerun-success-fixture:
    build:
      context: .
      dockerfile: docker/actions-fixture/Dockerfile
    entrypoint: ["python3", "/rerun_success.py"]

  gateway-fixture:
    build:
      context: .
      target: runtime
    environment:
      GITEA_BASE_URL: http://actions-fixture:8081
      GATEWAY_ADDR: :8080
    command: ["serve"]
    depends_on:
      - actions-fixture
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 8080"]
      interval: 2s
      timeout: 2s
      retries: 30

  runner:
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /state/runner.token
      GITEA_RUNNER_NAME: gh-gateway-e2e
      GITEA_RUNNER_LABELS: gh-gateway-e2e:host
    volumes:
      - e2e-state:/state:ro
      - runner-data:/data
    depends_on:
      gitea:
        condition: service_healthy

  caddy:
    image: caddy:2.10.2-alpine
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        aliases:
          - git.example.test
          - fixture.example.test
          - rerun-success.example.test
    depends_on:
      gateway:
        condition: service_healthy
      gateway-fixture:
        condition: service_healthy
      rerun-success-fixture:
        condition: service_started

  e2e:
    build:
      context: .
      dockerfile: docker/e2e/Dockerfile
      args:
        GH_VERSION: 2.95.0
        GH_P1A_VERSION: 2.100.0
        BABYSIT_PR_COMMIT: 0265dd7b4547fd6a88c6458f359b3c20731421c4
    volumes:
      - e2e-state:/state:ro
      - caddy-data:/caddy-data:ro
    depends_on:
      gitea:
        condition: service_healthy
      caddy:
        condition: service_started
      runner:
        condition: service_started

  codex-e2e:
    profiles: ["codex"]
    build:
      context: .
      dockerfile: docker/codex-e2e/Dockerfile
      args:
        CODEX_VERSION: 0.154.0
        GH_VERSION: 2.95.0
    environment:
      CODEX_HOME: /codex-home
      GH_HOST: git.example.test
      GH_PROMPT_DISABLED: "1"
    volumes:
      - e2e-state:/state:ro
      - caddy-data:/caddy-data:ro
    depends_on:
      gitea:
        condition: service_healthy
      caddy:
        condition: service_started
    stdin_open: true
    tty: true
    entrypoint: ["/bin/bash"]

volumes:
  gitea-data:
  e2e-state:
  caddy-data:
  caddy-config:
  runner-data:
